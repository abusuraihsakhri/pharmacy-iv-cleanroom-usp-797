[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacy-iv-cleanroom-usp-797"
version = "2.0.0"
description = "USP-797 Sentinel: Sterile Compounding Cleanroom Environment & Beyond-Use-Date"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["agents", "usp_797_cleanroom"]
py-modules = ["cli", "enrichment", "simulator", "usp_797_cleanroom_app"]

[project.scripts]
pharmacy-iv-cleanroom-usp-797 = "usp_797_cleanroom.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/pharmacy-iv-cleanroom-usp-797"
Repository = "https://github.com/abusuraihsakhri/pharmacy-iv-cleanroom-usp-797.git"
