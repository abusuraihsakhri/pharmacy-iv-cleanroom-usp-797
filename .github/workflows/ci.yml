name: Python verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Build container image
        if: matrix.python-version == '3.12'
        run: docker build -t cleanroom-threshold-demo .
      - name: Compile Python modules
        run: python -m compileall -q agents usp_797_cleanroom cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Check browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path("web/index.html").read_text(encoding="utf-8")
          matches = re.findall(r"<script>(.*?)</script>", html, re.DOTALL)
          assert len(matches) == 1
          with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8") as script:
              script.write(matches[0])
              script.flush()
              subprocess.run(["node", "--check", script.name], check=True)
          PY
